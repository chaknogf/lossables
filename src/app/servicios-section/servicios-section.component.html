<section id="servicios" class="section-padding bg-white">
  <div class="container">
    <header class="text-center mb-5">
      <span class="section-eyebrow">Nuestras Especialidades</span>
      <h2 class="section-title text-balance">Cuidamos tu salud de forma integral</h2>
      <p class="section-subtitle">
        Ofrecemos una amplia gama de servicios médicos especializados con
        tecnología de vanguardia y atención personalizada.
      </p>
    </header>

    <div class="row g-4 justify-content-center">
      <div
        class="col-12 col-sm-6 col-md-4 col-lg-3"
        *ngFor="let servicio of servicios; index as i"
      >
        <div
          appReveal
          [delay]="(i % 4) * 80"
          class="card card-hover h-100 border-0 text-center"
        >
          <div class="service-icon" [ngClass]="servicio.bg">
            <span [innerHTML]="servicio.icon" aria-hidden="true"></span>
          </div>
          <h3 class="h6 fw-semibold mb-2">{{ servicio.titulo }}</h3>
          <p class="mb-0 small lh-sm text-secondary">{{ servicio.descripcion }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
