<section id="doctores" class="section-padding bg-app-alt">
  <div class="container">
    <div class="text-center mb-5">
      <span class="section-eyebrow">Especialistas</span>
      <h2 class="section-title">Nuestro Equipo Médico</h2>
      <p class="section-subtitle">
        Profesionales altamente calificados, comprometidos con tu bienestar
      </p>
    </div>

    <div class="row g-4 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let doctor of doctors; index as i">
        <article
          appReveal
          [delay]="(i % 3) * 100"
          class="doctor-card h-100 text-center glass-card"
        >
          <div class="doctor-avatar-wrap">
            <img
              [src]="doctor.imagen"
              [alt]="'Doctora o doctor ' + doctor.nombre"
              class="doctor-avatar"
              loading="lazy"
              width="140"
              height="140"
            />
          </div>

          <h3 class="h5 fw-bold mb-1">{{ doctor.nombre }}</h3>
          <span class="doctor-specialty text-{{ doctor.color }}">
            {{ doctor.especialidad }}
          </span>

          <p class="doctor-desc text-secondary">{{ doctor.descripcion }}</p>

          <div class="doctor-stars mb-3" aria-label="Calificación: 5 de 5 estrellas">
            <i class="bi bi-star-fill" *ngFor="let _ of [1,2,3,4,5]"></i>
          </div>

          <a
            [href]="doctor.perfil"
            class="btn btn-sm btn-outline-primary btn-doctor"
          >
            Ver perfil completo
            <i class="bi bi-arrow-right ms-1"></i>
          </a>
        </article>
      </div>
    </div>
  </div>
</section>
