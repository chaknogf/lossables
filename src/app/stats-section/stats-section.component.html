<section class="stats-section py-5">
  <div class="container">
    <div #statsGrid class="row text-center gy-4 justify-content-center">
      <div class="col-6 col-md-3" *ngFor="let stat of stats">
        <div class="stat-card">
          <i class="bi {{ stat.icono }}" aria-hidden="true"></i>
          <div
            class="stat-counter"
            [attr.data-target]="stat.valor"
            [attr.data-suffix]="stat.sufijo"
          >{{ stat.valor }}{{ stat.sufijo }}</div>
          <p class="stat-label">{{ stat.etiqueta }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
